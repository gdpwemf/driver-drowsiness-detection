<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Driver Drowsiness Detection</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        #container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }

        video,
        canvas {
            width: min(90vw, 900px);
            border-radius: 12px;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
        }

        #status {
            margin-top: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        #info {
            margin-top: 10px;
            font-size: 16px;
            color: #ccc;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Driver Drowsiness Detection</h1>

<p>
    실시간으로 눈 상태를 분석합니다.
    사진이나 영상은 저장하지 않습니다.
</p>

<button id="startButton">
    Start Camera
</button>

<br>

<div id="container">

    <video
        id="video"
        autoplay
        playsinline
        muted
    ></video>

    <canvas id="canvas"></canvas>

</div>

<div id="status">
    READY
</div>

<div id="info"></div>


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script type="module" src="./app.js"></script>

</body>
</html>
